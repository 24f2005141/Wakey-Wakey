<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#18040d"/>
      <stop offset="60%" stop-color="#0b0106"/>
      <stop offset="100%" stop-color="#050003"/>
    </radialGradient>

    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d44c6c"/>
      <stop offset="45%" stop-color="#ea7a94"/>
      <stop offset="85%" stop-color="#f7b5c4"/>
      <stop offset="100%" stop-color="#fedce4"/>
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fff0f3"/>
      <stop offset="100%" stop-color="#ffd5df" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Contrail Gradient -->
    <linearGradient id="jetTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fedce4" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Clock Rim 3D Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#992345"/>
      <stop offset="50%" stop-color="#69142c"/>
      <stop offset="100%" stop-color="#400b1a"/>
    </linearGradient>

    <!-- Bell Gradient -->
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a82b4f"/>
      <stop offset="50%" stop-color="#70162f"/>
      <stop offset="100%" stop-color="#450b1b"/>
    </linearGradient>

    <!-- Pin Inner Shadow/Bevel -->
    <linearGradient id="innerRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ba355b"/>
      <stop offset="100%" stop-color="#3b0817"/>
    </linearGradient>

    <!-- Clip Path for Inside the Location Pin Clock Face -->
    <clipPath id="pinClip">
      <path d="M 256 122 C 196 122 150 168 150 228 C 150 286 256 368 256 368 C 256 368 362 286 362 228 C 362 168 316 122 256 122 Z"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- ================= ALARM CLOCK HOUSING ================= -->
  <!-- Top Handle -->
  <path d="M 205 106 C 205 78 307 78 307 106" fill="none" stroke="#70162f" stroke-width="12" stroke-linecap="round"/>
  <path d="M 205 106 C 205 82 307 82 307 106" fill="none" stroke="#a82b4f" stroke-width="5" stroke-linecap="round"/>

  <!-- Top Center Peg / Hammer -->
  <rect x="249" y="102" width="14" height="15" rx="3" fill="#8c1f3d"/>
  <rect x="242" y="98" width="28" height="7" rx="3" fill="#ba355b"/>

  <!-- Sound Waves (Left) -->
  <path d="M 132 128 C 120 142 120 162 132 176" fill="none" stroke="#e86b88" stroke-width="7" stroke-linecap="round"/>
  <path d="M 148 140 C 142 148 142 158 148 166" fill="none" stroke="#e86b88" stroke-width="6" stroke-linecap="round"/>

  <!-- Sound Waves (Right) -->
  <path d="M 380 128 C 392 142 392 162 380 176" fill="none" stroke="#e86b88" stroke-width="7" stroke-linecap="round"/>
  <path d="M 364 140 C 370 148 370 158 364 166" fill="none" stroke="#e86b88" stroke-width="6" stroke-linecap="round"/>

  <!-- Left Bell -->
  <g transform="rotate(-34 185 132)">
    <!-- Bell Leg -->
    <rect x="180" y="128" width="12" height="18" rx="3" fill="#450b1b"/>
    <!-- Bell Dome -->
    <ellipse cx="186" cy="116" rx="36" ry="24" fill="url(#bellGrad)"/>
    <ellipse cx="186" cy="116" rx="36" ry="24" fill="none" stroke="#ba355b" stroke-width="2"/>
    <circle cx="186" cy="92" r="7" fill="#ba355b"/>
  </g>

  <!-- Right Bell -->
  <g transform="rotate(34 327 132)">
    <!-- Bell Leg -->
    <rect x="320" y="128" width="12" height="18" rx="3" fill="#450b1b"/>
    <!-- Bell Dome -->
    <ellipse cx="326" cy="116" rx="36" ry="24" fill="url(#bellGrad)"/>
    <ellipse cx="326" cy="116" rx="36" ry="24" fill="none" stroke="#ba355b" stroke-width="2"/>
    <circle cx="326" cy="92" r="7" fill="#ba355b"/>
  </g>

  <!-- Outer Pin Shadow -->
  <path d="M 256 108 C 182 108 126 164 126 238 C 126 312 256 404 256 404 C 256 404 386 312 386 238 C 386 164 330 108 256 108 Z" fill="#000000" opacity="0.45"/>

  <!-- Outer Pin Clock Frame -->
  <path d="M 256 112 C 188 112 136 164 136 232 C 136 302 256 388 256 388 C 256 388 376 302 376 232 C 376 164 324 112 256 112 Z" fill="url(#rimGrad)"/>
  
  <!-- Outer Rim Highlight Border -->
  <path d="M 256 112 C 188 112 136 164 136 232 C 136 302 256 388 256 388 C 256 388 376 302 376 232 C 376 164 324 112 256 112 Z" fill="none" stroke="url(#innerRim)" stroke-width="5"/>

  <!-- Inner Bevel Rim -->
  <path d="M 256 120 C 194 120 146 166 146 228 C 146 290 256 372 256 372 C 256 372 366 290 366 228 C 366 166 318 120 256 120 Z" fill="#4a0e1f"/>

  <!-- ================= INSIDE CLOCK FACE (CLIPPED) ================= -->
  <g clip-path="url(#pinClip)">
    <!-- Sky Background -->
    <rect x="140" y="115" width="232" height="260" fill="url(#skyGrad)"/>

    <!-- Fluffy Clouds in Sky -->
    <g fill="#fbe1e7" opacity="0.65">
      <ellipse cx="200" cy="168" rx="28" ry="12"/>
      <ellipse cx="218" cy="164" rx="20" ry="10"/>
      <ellipse cx="186" cy="172" rx="16" ry="8"/>

      <ellipse cx="320" cy="208" rx="26" ry="10"/>
      <ellipse cx="336" cy="204" rx="18" ry="9"/>
      <ellipse cx="306" cy="211" rx="14" ry="7"/>
    </g>

    <!-- Contrail Jet Stream swooping across sky -->
    <path d="M 175 272 C 215 258 260 216 295 178" fill="none" stroke="url(#jetTrail)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 175 272 C 215 258 260 216 295 178" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

    <!-- Airplane Silhouette -->
    <g transform="translate(294, 172) rotate(-38) scale(0.68)">
      <!-- Fuselage -->
      <path d="M 0 -24 C 5 -24 7 18 0 24 C -7 18 -5 -24 0 -24 Z" fill="#2d0814"/>
      <!-- Main Wings -->
      <path d="M -26 4 L 26 4 L 6 -6 L -6 -6 Z" fill="#2d0814"/>
      <!-- Tail Wings -->
      <path d="M -12 20 L 12 20 L 4 15 L -4 15 Z" fill="#2d0814"/>
    </g>

    <!-- Glowing Sun on Horizon -->
    <ellipse cx="256" cy="276" rx="26" ry="24" fill="url(#sunGlow)"/>

    <!-- Back Mountains (Dark Violet Plum) -->
    <path d="M 140 310 L 182 268 L 222 292 L 256 265 L 294 294 L 334 266 L 372 312 L 372 370 L 140 370 Z" fill="#4d1025"/>
    <path d="M 182 268 L 202 295 L 222 292 Z" fill="#3c0c1c" opacity="0.6"/>
    <path d="M 256 265 L 275 295 L 294 294 Z" fill="#3c0c1c" opacity="0.6"/>
    <path d="M 334 266 L 350 298 L 372 312 Z" fill="#3c0c1c" opacity="0.6"/>

    <!-- Front Mountains (Deep Dark Plum Espresso) -->
    <path d="M 140 330 L 196 276 L 244 324 L 256 312 L 316 270 L 372 328 L 372 370 L 140 370 Z" fill="#290513"/>
    <path d="M 196 276 L 225 328 L 244 324 Z" fill="#1b030c" opacity="0.7"/>
    <path d="M 316 270 L 348 332 L 372 328 Z" fill="#1b030c" opacity="0.7"/>

    <!-- Winding Highway Road -->
    <path d="M 256 295 C 262 314 278 322 274 336 C 268 352 230 360 256 380 L 296 380 C 316 352 328 335 292 324 C 274 316 266 308 260 295 Z" fill="#400b1a"/>
    <path d="M 230 380 C 218 362 252 350 258 336 C 264 322 254 310 252 295 L 260 295 C 266 308 274 316 272 324 C 268 335 238 348 248 380 Z" fill="#541225"/>

    <!-- Road Dashed Centerline -->
    <path d="M 256 298 C 258 308 264 314 266 322 C 268 332 248 342 246 354 C 244 366 250 374 254 380" fill="none" stroke="#fedce4" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>

    <!-- Clock Hour Markers (12, 3, 6, 9) -->
    <!-- 12 o'clock -->
    <rect x="253" y="128" width="6" height="14" rx="3" fill="#2d0814"/>
    <!-- 3 o'clock -->
    <rect x="340" y="225" width="14" height="6" rx="3" fill="#2d0814"/>
    <!-- 9 o'clock -->
    <rect x="158" y="225" width="14" height="6" rx="3" fill="#2d0814"/>
    <!-- 6 o'clock (subtle dot above road) -->
    <circle cx="256" cy="340" r="3" fill="#ba355b" opacity="0.6"/>
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING ================= -->
  <!-- Radiating Sunburst Rays beside 'w' -->
  <g stroke="#ffa0b7" stroke-width="4.5" stroke-linecap="round">
    <line x1="88" y1="418" x2="78" y2="424"/>
    <line x1="95" y1="409" x2="94" y2="397"/>
    <line x1="108" y1="415" x2="114" y2="405"/>
  </g>

  <!-- Main "wakey wakey" Brand Typography -->
  <g fill="#e85d7f" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Fraunces', 'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', sans-serif" font-weight="800" letter-spacing="1">
    <text x="256" y="445" font-size="44" fill="#e85d7f">wakey wakey</text>
  </g>

  <!-- Subtitle Tagline with flanking lines -->
  <g text-anchor="middle">
    <!-- Left Flanking Line -->
    <line x1="96" y1="469" x2="132" y2="469" stroke="#e85d7f" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tagline Text -->
    <text x="256" y="473" font-family="'Space Mono', 'Plus Jakarta Sans', monospace, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#f07897">
      WAKE UP. PACK UP. TAKE OFF.
    </text>
    
    <!-- Right Flanking Line -->
    <line x1="380" y1="469" x2="416" y2="469" stroke="#e85d7f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
